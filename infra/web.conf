log_format mesa '$request_method $uri $status';
map $http_upgrade $conexion_mesa {
    default upgrade;
    '' '';
}
server {
    listen 80;
    access_log /var/log/nginx/access.log mesa;
    root /usr/share/nginx/html;
    index index.html;

    # Compose puede recrear un contenedor con otra IP mientras Nginx sigue activo.
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Exportación web de la app: las rutas profundas vuelven a su index.html.
    location = /app {
        absolute_redirect off;
        return 301 /app/;
    }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location /app/_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        set $api http://api:3001;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mesa;
        proxy_set_header Host $http_host;
    }

    location ~ ^/(realms|resources)/ {
        set $oidc http://identidad:8080;
        proxy_pass $oidc$request_uri;
        proxy_set_header Host $http_host;
    }
}
