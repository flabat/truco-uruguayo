log_format mesa '$request_method $uri $status';
map $http_upgrade $conexion_mesa {
    default upgrade;
    '' '';
}
server {
    listen 80;
    access_log /var/log/nginx/access.log mesa;
    root /usr/share/nginx/html;
    index index.html;

    # Compose puede recrear un contenedor con otra IP mientras Nginx sigue activo.
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Las redirecciones quedan relativas: el puerto publicado por Docker no es el 80 del contenedor.
    absolute_redirect off;
    # /jugar/ es la exportación web de la app: las rutas profundas vuelven a su index.html.
    location = /jugar {
        return 301 /jugar/$is_args$args;
    }
    location /jugar/ {
        try_files $uri $uri/ /jugar/index.html;
    }
    location /jugar/_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Enlaces ya compartidos: la dirección de prueba /app/… y el regreso /volver/?mesa= abren la misma pantalla.
    location = /app {
        return 301 /jugar/$is_args$args;
    }
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /jugar/$1 permanent;
    }
    location ~ ^/volver/?$ {
        return 301 /jugar/$is_args$args;
    }

    location /api/ {
        set $api http://api:3001;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conexion_mesa;
        proxy_set_header Host $http_host;
    }

    location ~ ^/(realms|resources)/ {
        set $oidc http://identidad:8080;
        proxy_pass $oidc$request_uri;
        proxy_set_header Host $http_host;
    }
}
