name: truco-local
services:
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        TRUCO_RELEASE: ${TRUCO_RELEASE:-}
    ports:
      - "${TRUCO_BIND:-127.0.0.1}:${WEB_PORT:-8081}:80"
      - "${TRUCO_BIND:-127.0.0.1}:${OIDC_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://truco:truco-local@db:5432/truco
      LOCAL_OIDC: "1"
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CATEGORY_ID: ${DISCORD_CATEGORY_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN_FILE: ${DISCORD_BOT_TOKEN_FILE:-}
      SALON_HABILITADO: "${SALON_HABILITADO:-0}"
      VOZ_ESPECTADORA_HABILITADA: "${VOZ_ESPECTADORA_HABILITADA:-0}"
      # Bajas vencidas: cliente de servicio de Keycloak (npm run auth:api) y Apple.
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_TOKENS_KEY: ${APPLE_TOKENS_KEY:-}
      EXHIBICIONES_HABILITADAS: "${EXHIBICIONES_HABILITADAS:-0}"
      EXHIBICIONES_OBJETIVO: "${EXHIBICIONES_OBJETIVO:-6}"
      EXHIBICIONES_PAUSADAS: "${EXHIBICIONES_PAUSADAS:-0}"
      MODELO_PIE_PAREJAS: "${MODELO_PIE_PAREJAS:-1}"
      SENAS_PIE_PAREJAS: "${SENAS_PIE_PAREJAS:-1}"
      SENAS_PIE_TERCETOS: "${SENAS_PIE_TERCETOS:-1}"
      WEB_ORIGIN: http://${TRUCO_HOST:-localhost}:${WEB_PORT:-8081}
      OIDC_CALLBACK: http://${TRUCO_HOST:-localhost}:${OIDC_PORT:-8080}/api/auth/callback
      OIDC_ISSUER: http://${TRUCO_HOST:-localhost}:${OIDC_PORT:-8080}/realms/mesa-local
      OIDC_BACKEND: http://identidad:8080/realms/mesa-local
      GESTION_SUJETO: ${GESTION_SUJETO:-}
    ports:
      - "${TRUCO_BIND:-127.0.0.1}:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: truco
      POSTGRES_USER: truco
      POSTGRES_PASSWORD: truco-local
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "truco", "-d", "truco"]
      interval: 3s
      timeout: 3s
      retries: 20

  identidad:
    build: {context: ., dockerfile: infra/keycloak/Dockerfile}
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_HOSTNAME=http://${TRUCO_HOST:-localhost}:${OIDC_PORT:-8080}
      - KC_BOOTSTRAP_ADMIN_USERNAME
      - KC_BOOTSTRAP_ADMIN_PASSWORD
    volumes:
      - identidad:/opt/keycloak/data
      - ./infra/truco-local-realm.json:/opt/keycloak/data/import/truco-local-realm.json:ro
      - ./infra/mesa-local-realm.json:/opt/keycloak/data/import/mesa-local-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/truco-local/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 30

volumes:
  postgres:
  identidad:
