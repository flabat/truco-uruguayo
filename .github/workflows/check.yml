name: Verificar el sitio

on: pull_request

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PAGES_URL: https://example.org/truco-uruguayo/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Revisar enlaces y anclas
        run: python3 .github/scripts/check_links.py dist "$PAGES_URL"
